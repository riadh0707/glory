name: Build Glory FCC Client

# Déclenchement manuel (bouton "Run workflow" dans l'onglet Actions de
# GitHub) ou sur la création d'un tag "v*" (ex. v1.0.0) — pas sur chaque
# push, pour ne pas consommer de minutes CI inutilement sur un dépôt privé.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: glory-fcc-client-windows
          path: client/release/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # electron-builder a besoin de "fpm" (paquet .deb) et "rpm" (non
      # utilisé ici) — installés nativement sur les runners Ubuntu via ce
      # paquet système, contrairement à Windows où fpm est indisponible.
      - run: sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential rpm
      - run: sudo gem install --no-document fpm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: glory-fcc-client-linux
          path: |
            client/release/*.AppImage
            client/release/*.deb
          if-no-files-found: error

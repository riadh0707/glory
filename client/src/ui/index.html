<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Glory FCC Client — Prototype</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="title-block">
      <h1>Glory FCC Client</h1>
      <p>Prototype — cycle de session BrueBoxService</p>
    </div>
    <span id="state-pill" class="status-pill state-Closed">
      <span class="dot"></span>
      <span id="state-label">Closed</span>
    </span>
  </header>

  <main>
    <div class="col-left">
      <div class="card">
        <h2>Session</h2>
        <div class="controls">
          <button id="btn-connect" class="primary">Connecter</button>
          <button id="btn-status" class="secondary">Statut</button>
          <button id="btn-disconnect" class="danger">Déconnecter</button>
        </div>
      </div>

      <div class="card" style="flex:1; min-height:0;">
        <h2>Statut (JSON)</h2>
        <pre id="status-output">—</pre>
      </div>
    </div>

    <div class="col-right">
      <div class="card log-panel">
        <h2>Journal (requêtes/réponses SOAP)</h2>
        <div id="log" class="log-body"></div>
      </div>

      <div class="card events-panel">
        <h2>Événements TCP reçus</h2>
        <div id="events" class="log-body"></div>
      </div>
    </div>
  </main>
</div>

<script src="./renderer.js"></script>
</body>
</html>

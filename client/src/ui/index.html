<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Glory FCC Client — Prototype</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="title-block">
      <h1>Glory FCC Client</h1>
      <p>Prototype — cycle de session BrueBoxService</p>
    </div>
    <span id="state-pill" class="status-pill state-Closed">
      <span class="dot"></span>
      <span id="state-label">Closed</span>
    </span>
  </header>

  <main>
    <div class="col-left">
      <div class="card">
        <h2>Session</h2>
        <div class="controls">
          <button id="btn-connect" class="primary">Connecter</button>
          <button id="btn-status" class="secondary">Statut</button>
          <button id="btn-disconnect" class="danger">Déconnecter</button>
        </div>
      </div>

      <div class="card">
        <h2>Encaissement</h2>
        <div class="controls">
          <button id="btn-start-cashin" class="secondary">Démarrer encaissement</button>
          <button id="btn-end-cashin" class="secondary">Terminer encaissement</button>
          <label for="input-amount" style="font-size:12px; color:var(--ink-dim); margin-top:4px;">
            Montant à encaisser
          </label>
          <input id="input-amount" type="text" inputmode="numeric" placeholder="ex. 1000"
                 style="padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
          <button id="btn-change" class="primary">Encaisser (Change)</button>
        </div>
      </div>

      <div class="card">
        <h2>Remplissage / Déverrouillage / Inventaire</h2>
        <div class="controls">
          <button id="btn-start-replenish" class="secondary">Démarrer remplissage (entrée)</button>
          <button id="btn-end-replenish" class="secondary">Terminer remplissage</button>
          <button id="btn-unlock" class="secondary">Déverrouiller (RBW-100)</button>
          <button id="btn-lock" class="secondary">Verrouiller (RBW-100)</button>
          <button id="btn-inventory" class="secondary">Inventaire</button>
          <button id="btn-open-exit-cover" class="secondary">Ouvrir couvercle sortie</button>
          <button id="btn-close-exit-cover" class="secondary">Fermer couvercle sortie</button>
        </div>
      </div>

      <div class="card">
        <h2>Supervision / diagnostic</h2>
        <div class="controls">
          <button id="btn-rom-version" class="secondary">Versions firmware</button>
          <button id="btn-adjust-time" class="secondary">Régler date/heure (= heure système)</button>
          <label for="input-setting-filename" style="font-size:12px; color:var(--ink-dim); margin-top:4px;">
            Nom du fichier de configuration
          </label>
          <input id="input-setting-filename" type="text" placeholder="ex. GloryCo.xml"
                 style="padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
          <button id="btn-get-setting-file" class="secondary">Lire fichier config</button>
          <button id="btn-reset" class="danger">Reset (récupération d'erreur, peut être lent)</button>
        </div>
      </div>

      <div class="card">
        <h2>Annulation / retour d'espèces</h2>
        <div class="controls">
          <button id="btn-cashin-cancel" class="secondary">Annuler encaissement (CashinCancel)</button>
          <button id="btn-change-cancel" class="secondary">Annuler Change en attente</button>
          <button id="btn-replenish-entrance-cancel" class="secondary">Annuler remplissage (entrée)</button>
          <button id="btn-return-cash" class="secondary">Renvoyer pièces (hopper → sortie)</button>
          <label for="input-cashout-cc" style="font-size:12px; color:var(--ink-dim); margin-top:4px;">Cashout : cc / fv / devid / pièces</label>
          <div style="display:flex; gap:6px;">
            <input id="input-cashout-cc" type="text" placeholder="EUR" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-cashout-fv" type="text" placeholder="1000" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-cashout-devid" type="text" placeholder="1" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-cashout-piece" type="text" inputmode="numeric" placeholder="1" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
          </div>
          <button id="btn-cashout" class="danger">Cashout (distribution manuelle, irréversible)</button>
        </div>
      </div>

      <div class="card">
        <h2>Gestion des dénominations</h2>
        <div class="controls">
          <label for="input-denom-cc" style="font-size:12px; color:var(--ink-dim);">Devise (cc) / Valeur faciale (fv) / devid</label>
          <div style="display:flex; gap:6px;">
            <input id="input-denom-cc" type="text" placeholder="EUR" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-denom-fv" type="text" placeholder="2000" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-denom-devid" type="text" placeholder="1" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
          </div>
          <button id="btn-enable-denom" class="secondary">Autoriser cette dénomination</button>
          <button id="btn-disable-denom" class="secondary">Interdire cette dénomination</button>
          <label for="input-exchange-from" style="font-size:12px; color:var(--ink-dim); margin-top:4px;">Taux de change : de / vers / taux</label>
          <div style="display:flex; gap:6px;">
            <input id="input-exchange-from" type="text" placeholder="USD" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-exchange-to" type="text" placeholder="EUR" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
            <input id="input-exchange-rate" type="text" placeholder="0.9" style="flex:1; padding:8px; border-radius:7px; border:1px solid var(--rule); background:var(--mono-bg); color:var(--ink); font-family:Consolas,monospace;" />
          </div>
          <button id="btn-set-exchange-rate" class="primary">Définir le taux de change</button>
        </div>
      </div>

      <div class="card" style="flex:1; min-height:0;">
        <h2>Statut (JSON)</h2>
        <pre id="status-output">—</pre>
      </div>
    </div>

    <div class="col-right">
      <div class="card log-panel">
        <h2>Journal (requêtes/réponses SOAP)</h2>
        <div id="log" class="log-body"></div>
      </div>

      <div class="card events-panel">
        <h2>Événements TCP reçus</h2>
        <div id="events" class="log-body"></div>
      </div>
    </div>
  </main>
</div>

<script src="./renderer.js"></script>
</body>
</html>
